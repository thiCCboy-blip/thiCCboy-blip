<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Amruth Raj portrait in a circular blue-white halftone style">
<defs>
 <radialGradient id="bg"><stop offset="0" stop-color="#15243a"/><stop offset="1" stop-color="#070b13"/></radialGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#78b7e8" stop-opacity=".22"/><stop offset="1" stop-color="#78b7e8" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.65" fill="#dceeff"/></pattern>
 <clipPath id="round"><circle cx="320" cy="320" r="286"/></clipPath>
 <mask id="photoMask" maskUnits="userSpaceOnUse" x="34" y="34" width="572" height="572" mask-type="luminance">
  <image href="data:image/jpeg;base64," x="34" y="34" width="572" height="572" preserveAspectRatio="xMidYMid slice"/>
 </mask>
</defs>
<circle cx="320" cy="320" r="312" fill="url(#bg)"/>
<circle cx="320" cy="320" r="300" fill="url(#halo)"/>
<g clip-path="url(#round)">
 <image href="data:image/jpeg;base64," x="34" y="34" width="572" height="572" preserveAspectRatio="xMidYMid slice" opacity=".12"/>
 <rect x="34" y="34" width="572" height="572" fill="url(#dots)" mask="url(#photoMask)"/>
</g>
<circle cx="320" cy="320" r="296" fill="none" stroke="#8ab9df" stroke-opacity=".58" stroke-width="1.4"/>
<circle cx="320" cy="320" r="282" fill="none" stroke="#8ab9df" stroke-opacity=".2" stroke-width=".8" stroke-dasharray="2 8"/>
<path d="M320 8 A312 312 0 0 1 632 320" fill="none" stroke="#8ab9df" stroke-opacity=".6" stroke-width="1.2"/>
<path d="M8 320 A312 312 0 0 1 320 8" fill="none" stroke="#8ab9df" stroke-opacity=".25" stroke-width="1.2"/>
</svg>